services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobportal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobportal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobportal} -d ${POSTGRES_DB:-jobportal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobportal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://jobportal:jobportal_dev_password@db:5432/jobportal}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-64-char-hex-string-before-any-real-use}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-3/minute}
    volumes:
      - resume_uploads:/app/uploads
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jobportal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - jobportal

volumes:
  pgdata:
  resume_uploads:

networks:
  jobportal:
    driver: bridge
